secrets:
  grafana_cloud_instance_id:
    file: ./secrets/grafana-cloud-instance-id
  grafana_cloud_api_token:
    file: ./secrets/grafana-cloud-api-token
  grafana_admin_password:
    file: ./secrets/grafana-admin-password
  maintainer_cockpit_github_app_private_key:
    file: ./secrets/maintainer-cockpit-github-app.pem

services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: always # To re-read the configuration file
    user: "1000:1000"
    environment:
      - OTEL_SERVICE_NAME=prometheus
      - OTEL_RESOURCE_ATTRIBUTES=service.instance.id=prometheus
    ports:
      - 81:9090
    volumes: 
      - ./prometheus/rules:/etc/prometheus/rules
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/storage:/prometheus
    command: 
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-admin-api 
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion,promql-experimental-functions
    depends_on:
      - otel-collector


  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    user: "1000:1000"
    ports: 
      - 82:3000
    environment: 
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_PLUGINS_PREINSTALL=grafana-assistant-app
      - GF_SERVER_ROOT_URL=http://localhost:82/
      - OTEL_SERVICE_NAME=grafana
      - OTEL_RESOURCE_ATTRIBUTES=service.instance.id=grafana
      - GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS=otel-collector:4317
      - GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION=w3c
      - GF_DIAGNOSTICS_PROFILING_ENABLED=true
      - GF_DIAGNOSTICS_PROFILING_ADDR=0.0.0.0
      - GF_DIAGNOSTICS_PROFILING_PORT=6060
    volumes: 
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/storage:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      - loki
      - otel-collector
      - pyroscope


  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    environment:
      - OTEL_SERVICE_NAME=alertmanager
      - OTEL_RESOURCE_ATTRIBUTES=service.instance.id=alertmanager
    ports: 
      - 83:9093
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes: 
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    depends_on:
      - otel-collector


  node_exporter:
    privileged: true
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    ports: 
      - "9100:9100"

  garmin_exporter_arthur:
    image: ghcr.io/barnes-c/garmin_exporter:1.1.4@sha256:0da1851098baf2bba1c5ee38977457367c59366999a532ee52a7bad77511200a
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=garmin_exporter_arthur
    env_file:
      - ./secrets/garmin-arthur.env
    command:
      - --token-file=/data/garmin_token.json
      - --cache.ttl=10m
    volumes:
      - garmin_data:/data

  garmin_exporter_julia:
    image: ghcr.io/barnes-c/garmin_exporter:1.1.4@sha256:0da1851098baf2bba1c5ee38977457367c59366999a532ee52a7bad77511200a
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=garmin_exporter_julia
    env_file:
      - ./secrets/garmin-julia.env
    command:
      - --token-file=/data/garmin_token.json
      - --cache.ttl=10m
    volumes:
      - garmin_data_julia:/data

  blackbox_exporter: 
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc

  maintainer-cockpit:
    build:
      context: ../maintainer-cockpit
    image: maintainer-cockpit:dev
    command:
      - serve
      - --config
      - /etc/maintainer-cockpit/config.yaml
      - --database
      - /var/lib/maintainer-cockpit/maintainer-cockpit.db
      - --listen
      - 0.0.0.0:8765
    env_file:
      - path: ./secrets/maintainer-cockpit.env
        required: false
    environment:
      OTEL_CONFIG_FILE: /etc/maintainer-cockpit/otel-sdk.yaml
    volumes:
      - ./maintainer-cockpit/config.yaml:/etc/maintainer-cockpit/config.yaml:ro
      - ./maintainer-cockpit/otel-sdk.yaml:/etc/maintainer-cockpit/otel-sdk.yaml:ro
      - maintainer_cockpit_data:/var/lib/maintainer-cockpit
    secrets:
      - source: maintainer_cockpit_github_app_private_key
        target: maintainer-cockpit-github-app.pem
    depends_on:
      - otel-collector
    restart: unless-stopped

  maintainer-cockpit-caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./maintainer-cockpit/Caddyfile:/etc/caddy/Caddyfile:ro
      - maintainer_cockpit_caddy_data:/data
      - maintainer_cockpit_caddy_config:/config
    depends_on:
      - maintainer-cockpit
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: 
      - --config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - ./loki/storage:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command:
      - --config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml
      - ./tempo/storage:/var/tempo
    ports:
      - "3200:3200"

  pyroscope:
    image: grafana/pyroscope:2.3.1@sha256:86a9ee7448487409ead8ada78789de7b78b739711b92b5d7224a1a54abf3eeb2
    command:
      - --distributor.ingestion-rate-limit-mb=32
      - --distributor.ingestion-burst-size-mb=16
      - --self-profiling.disable-push=true
      - server
    volumes:
      - ./pyroscope/storage:/data
    ports:
      - "4040:4040"

  otel-collector:
    image: home-monitoring/otel-collector:0.152.1
    build:
      context: .
      dockerfile: opentelemetry-collector/Dockerfile
    user: "0:0"
    restart: always # To re-read the configuration file
    command:
      - --config=/etc/otel-collector/config.yaml
      - --config=/etc/otel-collector/config-applications.yaml
      - --config=/etc/otel-collector/config-grafana-cloud.yaml
      - --feature-gates=service.profilesSupport
    volumes:
      - ./opentelemetry-collector/config.yaml:/etc/otel-collector/config.yaml:ro
      - ./opentelemetry-collector/config-applications.yaml:/etc/otel-collector/config-applications.yaml:ro
      - ./opentelemetry-collector/config-grafana-cloud.yaml:/etc/otel-collector/config-grafana-cloud.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    secrets:
      - grafana_cloud_instance_id
      - grafana_cloud_api_token
    depends_on:
      - loki
      - tempo
      - pyroscope

volumes:
  garmin_data:
  garmin_data_julia:
  maintainer_cockpit_data:
  maintainer_cockpit_caddy_data:
  maintainer_cockpit_caddy_config:
