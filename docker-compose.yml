secrets:
  grafana_cloud_instance_id:
    file: ./secrets/grafana-cloud-instance-id
  grafana_cloud_api_token:
    file: ./secrets/grafana-cloud-api-token
  grafana_admin_password:
    file: ./secrets/grafana-admin-password

services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: always # To re-read the configuration file
    user: "1000:1000"
    environment:
      - OTEL_SERVICE_NAME=prometheus
    ports:
      - 81:9090
    volumes: 
      - ./prometheus/rules:/etc/prometheus/rules
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/storage:/prometheus
    command: 
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-admin-api 
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion,promql-experimental-functions
    depends_on:
      - otel-collector


  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    user: "1000:1000"
    ports: 
      - 82:3000
    environment: 
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_PLUGINS_PREINSTALL=grafana-assistant-app
      - GF_SERVER_ROOT_URL=http://localhost:82/
      - OTEL_SERVICE_NAME=grafana
      - GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS=otel-collector:4317
      - GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION=w3c
      - GF_DIAGNOSTICS_PROFILING_ENABLED=true
      - GF_DIAGNOSTICS_PROFILING_ADDR=0.0.0.0
      - GF_DIAGNOSTICS_PROFILING_PORT=6060
    volumes: 
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/storage:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      - loki
      - otel-collector
      - pyroscope


  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    environment:
      - OTEL_SERVICE_NAME=alertmanager
    ports: 
      - 83:9093
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes: 
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    depends_on:
      - otel-collector


  node_exporter:
    privileged: true
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    ports: 
      - "9100:9100"

  garmin_exporter_arthur:
    image: ghcr.io/barnes-c/garmin_exporter:1.1.2@sha256:5c642ad98c9715cf15a0a3c2c95ed4382fe324df22ed955c14fd14402af24432
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=garmin_exporter_arthur
    env_file:
      - ./secrets/garmin-arthur.env
    command:
      - --token-file=/data/garmin_token.json
      - --cache.ttl=10m
    volumes:
      - garmin_data:/data

  garmin_exporter_julia:
    image: ghcr.io/barnes-c/garmin_exporter:1.1.2@sha256:5c642ad98c9715cf15a0a3c2c95ed4382fe324df22ed955c14fd14402af24432
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=garmin_exporter_julia
    env_file:
      - ./secrets/garmin-julia.env
    command:
      - --token-file=/data/garmin_token.json
      - --cache.ttl=10m
    volumes:
      - garmin_data_julia:/data

  blackbox_exporter: 
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    command: 
      - --config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - ./loki/storage:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command:
      - --config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml
      - ./tempo/storage:/var/tempo
    ports:
      - "3200:3200"

  pyroscope:
    image: grafana/pyroscope:2.2.0@sha256:7f019d866e474609c7f112d2632d75bdf8ad418c08461fcb5193444bb6dc476d
    command:
      - --distributor.ingestion-rate-limit-mb=32
      - --distributor.ingestion-burst-size-mb=16
      - --self-profiling.disable-push=true
      - server
    volumes:
      - ./pyroscope/storage:/var/lib/pyroscope
    ports:
      - "4040:4040"

  otel-collector:
    image: home-monitoring/otel-collector:0.152.1
    build:
      context: .
      dockerfile: opentelemetry-collector/Dockerfile
    user: "0:0"
    restart: always # To re-read the configuration file
    command: ["--config=/etc/otel-collector-config.yaml", "--feature-gates=service.profilesSupport"]
    volumes:
      - ./opentelemetry-collector/config.yaml:/etc/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    secrets:
      - grafana_cloud_instance_id
      - grafana_cloud_api_token
    depends_on:
      - garmin_exporter_arthur
      - garmin_exporter_julia
      - loki
      - tempo
      - pyroscope

volumes:
  garmin_data:
  garmin_data_julia:
