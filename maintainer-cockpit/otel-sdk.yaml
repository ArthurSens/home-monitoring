file_format: "1.0-rc.2"

resource:
  attributes:
    - name: service.name
      value: maintainer-cockpit
    - name: service.instance.id
      value: maintainer-cockpit

logger_provider:
  processors:
    - batch:
        schedule_delay: 1000
        exporter:
          otlp_http:
            endpoint: http://otel-collector:4318/v1/logs
            timeout: 5000

tracer_provider:
  processors:
    - batch:
        schedule_delay: 1000
        exporter:
          otlp_http:
            endpoint: http://otel-collector:4318/v1/traces
            timeout: 5000

meter_provider:
  readers:
    - periodic:
        interval: 5000
        timeout: 5000
        exporter:
          otlp_http:
            endpoint: http://otel-collector:4318/v1/metrics
            timeout: 5000
